name: log-sentinel

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: log-sentinel-kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: log-sentinel-kafka-ui
    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: "log-sentinel"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: log-sentinel-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: "log_sentinel"
      POSTGRES_USER: "log_sentinel"
      POSTGRES_PASSWORD: "log_sentinel"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_sentinel -d log_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  flyway:
    image: redgate/flyway:12.11.0
    container_name: log-sentinel-flyway

    environment:
      FLYWAY_URL: "jdbc:postgresql://postgres:5432/log_sentinel"
      FLYWAY_USER: "log_sentinel"
      FLYWAY_PASSWORD: "log_sentinel"
      FLYWAY_CONNECT_RETRIES: "10"

    volumes:
      - ./database/migrations:/flyway/sql:ro

    depends_on:
      postgres:
        condition: service_healthy

    command: migrate
    restart: "no"

  evaluator:
    image: log-sentinel-evaluator:local
    container_name: log-sentinel-evaluator

    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "log-events"
      KAFKA_GROUP_ID: "log-sentinel-evaluator"
      RULES_FILE: "/config/rules.yaml"
      LOG_SENTINEL_DB_URL: "jdbc:postgresql://postgres:5432/log_sentinel"
      LOG_SENTINEL_DB_USER: "log_sentinel"
      LOG_SENTINEL_DB_PASSWORD: "log_sentinel"
      KAFKA_POLL_TIMEOUT_MS: "1000"

    volumes:
      - ./config/rules.yaml:/config/rules.yaml:ro

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

    restart: unless-stopped

  ingester:
    image: log-sentinel-ingester:local
    container_name: log-sentinel-ingester

    environment:
      LOG_DIRECTORY: "/logs"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "log-events"
      SOURCE_TIME_ZONE: "UTC"

    volumes:
      - ./runtime/logs:/logs

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

  api:
    image: log-sentinel-api:local
    container_name: log-sentinel-api
    ports:
      - "8080:8080"

    environment:
      LOG_SENTINEL_DB_URL: "jdbc:postgresql://postgres:5432/log_sentinel"
      LOG_SENTINEL_DB_USER: "log_sentinel"
      LOG_SENTINEL_DB_PASSWORD: "log_sentinel"

    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres-data:
