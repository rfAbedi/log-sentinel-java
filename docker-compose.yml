name: log-sentinel

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: log-sentinel-kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: log-sentinel-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: "log_sentinel"
      POSTGRES_USER: "log_sentinel"
      POSTGRES_PASSWORD: "log_sentinel"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_sentinel -d log_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  flyway:
    image: redgate/flyway:12.11.0
    container_name: log-sentinel-flyway

    environment:
      FLYWAY_URL: "jdbc:postgresql://postgres:5432/log_sentinel"
      FLYWAY_USER: "log_sentinel"
      FLYWAY_PASSWORD: "log_sentinel"
      FLYWAY_CONNECT_RETRIES: "10"

    volumes:
      - ./database/migrations:/flyway/sql:ro

    depends_on:
      postgres:
        condition: service_healthy

    command: migrate
    restart: "no"

volumes:
  postgres-data:
